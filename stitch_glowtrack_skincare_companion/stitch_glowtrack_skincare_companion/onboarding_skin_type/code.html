<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GlowTrack - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#544244",
                        "surface-container-low": "#f5f3f3",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d8e2df",
                        "primary-container": "#fde2e4",
                        "on-secondary-fixed-variant": "#3f4947",
                        "surface-container": "#efeded",
                        "on-error": "#ffffff",
                        "on-primary-container": "#776365",
                        "tertiary-container": "#ffe1e6",
                        "primary-fixed-dim": "#dac0c2",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#865d66",
                        "on-surface": "#1b1c1c",
                        "secondary-fixed-dim": "#bfc9c6",
                        "inverse-on-surface": "#f2f0f0",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#141d1c",
                        "on-tertiary-fixed-variant": "#613c45",
                        "outline": "#807475",
                        "on-secondary-container": "#5b6562",
                        "on-tertiary-fixed": "#2f121a",
                        "surface-tint": "#6d595b",
                        "primary": "#6d595b",
                        "secondary-fixed": "#dbe5e2",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#ecb9c4",
                        "surface-variant": "#e4e2e2",
                        "on-surface-variant": "#4e4445",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffd9e0",
                        "inverse-primary": "#dac0c2",
                        "on-primary-fixed": "#26181a",
                        "outline-variant": "#d2c3c4",
                        "surface-dim": "#dbd9d9",
                        "surface-container-high": "#eae8e7",
                        "on-background": "#1b1c1c",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#fbf9f8",
                        "surface-container-highest": "#e4e2e2",
                        "inverse-surface": "#303030",
                        "surface": "#fbf9f8",
                        "secondary": "#57605e",
                        "primary-fixed": "#f7dcde",
                        "tertiary": "#7b535c",
                        "background": "#fbf9f8"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "120px",
                        "margin-mobile": "20px",
                        "lg": "40px",
                        "sm": "12px",
                        "xs": "4px",
                        "base": "8px",
                        "gutter": "16px",
                        "xl": "64px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Quicksand"],
                        "headline-lg": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "display": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "body-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .ambient-shadow {
            box-shadow: 0 24px 32px rgba(74,74,74,0.05);
        }
        
        /* Subtle glow for selected state */
        .selected-glow {
            box-shadow: 0 0 0 2px #6d595b, 0 12px 24px rgba(109,89,91,0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Onboarding - Transactional, so suppressed bottom nav, simplified top nav) -->
<header class="w-full sticky top-0 backdrop-blur-xl bg-surface/80 flex items-center justify-between px-margin-mobile md:px-margin-desktop py-base z-50">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-display text-headline-md md:text-display text-primary">GlowTrack</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-lg md:py-xl max-w-[1140px] mx-auto w-full relative z-10">
<!-- Header Section -->
<div class="text-center mb-lg">
<span class="inline-block bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-1 rounded-full mb-md">Step 1 of 3</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Tell us about your skin</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Select your primary skin type to help us personalize your GlowTrack routine.</p>
</div>
<!-- Bento Grid for Skin Types -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-sm md:gap-gutter max-w-3xl mx-auto w-full mb-xl">
<!-- Oily -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:-translate-y-1 transition-transform duration-300 border border-transparent hover:border-surface-variant group h-40">
<div class="w-16 h-16 rounded-full bg-secondary-container/30 flex items-center justify-center text-on-secondary-container group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-[32px] opacity-70">water_drop</span>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">Oily</span>
</button>
<!-- Dry -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:-translate-y-1 transition-transform duration-300 border border-transparent hover:border-surface-variant group h-40">
<div class="w-16 h-16 rounded-full bg-tertiary-container/30 flex items-center justify-center text-on-tertiary-container group-hover:bg-tertiary-container/50 transition-colors">
<span class="material-symbols-outlined text-[32px] opacity-70">air</span>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">Dry</span>
</button>
<!-- Combination -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:-translate-y-1 transition-transform duration-300 border border-transparent hover:border-surface-variant group h-40 col-span-2 md:col-span-1">
<div class="w-16 h-16 rounded-full bg-surface-variant/50 flex items-center justify-center text-on-surface-variant group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[32px] opacity-70">contrast</span>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">Combination</span>
</button>
<!-- Sensitive (Selected State) -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm selected-glow relative overflow-hidden h-40 transform scale-[1.02]">
<div class="absolute top-3 right-3 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[32px]">spa</span>
</div>
<span class="font-body-md text-body-md text-on-surface font-semibold">Sensitive</span>
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
</button>
<!-- Normal -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:-translate-y-1 transition-transform duration-300 border border-transparent hover:border-surface-variant group h-40">
<div class="w-16 h-16 rounded-full bg-secondary-container/30 flex items-center justify-center text-on-secondary-container group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-[32px] opacity-70">face</span>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">Normal</span>
</button>
</div>
<!-- Bottom Action Area -->
<div class="mt-auto pt-lg pb-md flex justify-center w-full max-w-3xl mx-auto">
<button class="w-full md:w-auto md:min-w-[300px] bg-primary text-on-primary py-4 px-8 rounded-full font-label-md text-label-md uppercase tracking-wider ambient-shadow hover:bg-primary/90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</main>
</body></html>
